name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Check config guard (без config должен упасть)
        run: |
          rm -f Psychologist_nearby/appsettings.json
          if dotnet run --project Psychologist_nearby -c Release; then
            echo " ОШИБКА: приложение запустилось без конфига"
            exit 1
          else
            echo " Проверка пройдена: приложение упало без конфига"
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: '**/TestResults/**/coverage.cobertura.xml'